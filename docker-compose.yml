services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vectorpress-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vectorpress}
      POSTGRES_USER: ${POSTGRES_USER:-vectorpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vectorpress}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vectorpress} -d ${POSTGRES_DB:-vectorpress}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: vectorpress-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama3-8b-8192}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RAG_MAX_AGE_DAYS: ${RAG_MAX_AGE_DAYS:-3}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: vectorpress-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
