services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-pulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_pulse}
      POSTGRES_USER: ${POSTGRES_USER:-ai_pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_pulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_pulse} -d ${POSTGRES_DB:-ai_pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ai-pulse-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
